spring.application.name=EventManagement
server.port=8089
### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/EventManagement?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto= update
#Logging
logging.level.root = info
logging.pattern.console= %d{yyyy-MM-dd HH:mm:ss} -%level -%logger{60} %msg %n
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
event.photos.upload-dir=src/main/resources/static/events/

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# SMTP (Gmail) using TLS (STARTTLS)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=        # set in env (e.g. your Gmail address)
spring.mail.password=    # set in env (use the App Password)
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
